<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MODOLOG | Entrar</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:#29313a;background:#f1f3f5;min-height:100vh}header{text-align:center;background:linear-gradient(125deg,#292e35,#49515b);color:#fff;padding:48px 16px 88px;border-bottom:5px solid #f58220}.brand{font-size:clamp(43px,9vw,65px);font-weight:900;font-style:italic;letter-spacing:-2px;color:#ff821c}.brand span{color:#e5e7eb}.subtitle{font-size:12px;letter-spacing:2px;font-weight:700}header h1{font-size:23px;margin:24px 0 0}main{max-width:470px;margin:-54px auto 0;padding:0 18px 36px;position:relative}.panel{background:#fff;border:1px solid #e0e5e9;border-radius:18px;box-shadow:0 12px 30px #0002;padding:30px}.panel h2{margin:0 0 8px}.panel p{line-height:1.5;color:#626f7b}label{display:block;font-weight:700;margin:19px 0 7px}input{width:100%;border:1px solid #bac4ce;border-radius:9px;padding:14px;font:inherit}input:focus{outline:2px solid #f58220;outline-offset:1px}button{margin-top:24px;width:100%;background:#ec790f;border:0;border-radius:9px;padding:15px;color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#msg{min-height:22px;margin-top:14px;color:#ad2d1d;font-size:14px}footer{text-align:center;font-size:12px;color:#68737c;padding:15px}</style></head><body><header><div class="brand">MODO<span>LOG</span></div><div class="subtitle">SERVIÇOS E LOCAÇÕES</div><h1>Portal de aplicativos</h1></header><main><section class="panel"><h2>Entrar</h2><p>Utilize seu e-mail e senha do MODOLOG Checklist.</p><form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" maxlength="254" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Entrar nos aplicativos</button><div id="msg" role="alert" aria-live="polite"></div></form></section></main><footer>MODOLOG Serviços e Locações</footer><script>const form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='';try{const res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{throw Error('O servidor não retornou JSON (HTTP '+res.status+'). Verifique a publicação das Functions.')}if(!res.ok)throw Error(data.error||'Falha de autenticação (HTTP '+res.status+').');document.getElementById('password').value='';location.assign('/apps');}catch(err){msg.textContent=err.message||'Falha ao entrar.';}finally{btn.disabled=false}});</script></body></html>
