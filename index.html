<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MODOLOG | Entrar</title><style>
:root{--orange:#f58220;--orange2:#df6d0b;--ink:#252d35;--muted:#667380;--line:#dce2e7;--paper:#fff;--bg:#f3f5f7}*{box-sizing:border-box}html{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{margin:0;color:var(--ink);background:var(--bg);min-height:100vh}button,input{font:inherit}button,a{transition:filter .15s,transform .15s}button:hover,a.button:hover{filter:brightness(.96)}button:active,a.button:active{transform:translateY(1px)}.top{background:linear-gradient(125deg,#252c34,#46515b);border-bottom:5px solid var(--orange);color:#fff;padding:27px 22px 80px}.wrap{max-width:1080px;margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:clamp(31px,5vw,46px);font-style:italic;font-weight:950;letter-spacing:-2px;color:var(--orange);line-height:1}.brand span{color:#f1f3f5}.brand-sub{font-size:10px;font-weight:750;letter-spacing:2px;margin-top:7px;color:#e0e4e7}.top-label{font-size:12px;font-weight:750;letter-spacing:.12em;color:#e0e4e7;text-transform:uppercase}.headline{margin-top:52px}.headline h1{font-size:clamp(29px,4.5vw,44px);line-height:1.12;margin:0 0 12px;letter-spacing:-.04em}.headline p{margin:0;color:#e1e5e9;font-size:16px;line-height:1.5}.content{max-width:1080px;margin:-42px auto 0;padding:0 22px 45px;position:relative}.panel,.app-card{background:var(--paper);border:1px solid var(--line);border-radius:19px;box-shadow:0 15px 34px #17202a12}.panel{max-width:490px;margin:0 auto;padding:34px}.panel h2{margin:0;font-size:25px;letter-spacing:-.025em}.muted{color:var(--muted);line-height:1.55}.eyebrow{font-size:12px;color:var(--orange2);font-weight:800;letter-spacing:.11em;text-transform:uppercase}.field{margin-top:21px}.field label{display:block;font-size:14px;font-weight:750;margin-bottom:8px}.field input{width:100%;padding:15px;border:1px solid #b9c4ce;border-radius:11px;background:#fbfcfd;color:var(--ink)}.field input:focus{outline:3px solid #f5822044;border-color:var(--orange)}.button{border:0;border-radius:11px;background:var(--orange);color:#fff;padding:14px 20px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.button.primary{width:100%;margin-top:26px}.button:disabled{opacity:.65;cursor:wait}.button.secondary{background:#fff;color:var(--ink);border:1px solid #c7d0d8}.status{min-height:24px;color:#ad2d1d;font-size:14px;margin-top:15px}.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.app-card{padding:28px;display:flex;flex-direction:column;align-items:flex-start;min-height:278px}.app-icon{display:grid;place-items:center;background:#fff2e7;border:1px solid #ffdfc3;border-radius:13px;width:56px;height:56px;font-size:27px}.app-card h2{font-size:23px;letter-spacing:-.025em;margin:21px 0 7px}.app-card p{color:var(--muted);line-height:1.55;margin:0 0 24px;flex:1}.footer{text-align:center;color:#7b8792;font-size:12px;padding:5px 20px 25px}.userbox{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;padding:18px 22px;border:1px solid var(--line);border-radius:15px;background:#fff}.userbox strong{display:block;margin-top:4px}.hint{color:var(--muted);font-size:13px;margin-top:24px}@media(max-width:650px){.top{padding:24px 19px 74px}.top-label{display:none}.headline{margin-top:40px}.content{padding:0 16px 35px}.panel{padding:25px 22px}.apps{grid-template-columns:1fr}.app-card{min-height:245px;padding:24px}.userbox{align-items:flex-start;flex-direction:column}.button.secondary{width:100%}}@media(prefers-reduced-motion:reduce){button,a{transition:none}}
</style></head><body><header class="top"><div class="wrap"><div class="nav"><div><div class="brand">MODO<span>LOG</span></div><div class="brand-sub">SERVIÇOS E LOCAÇÕES</div></div><div class="top-label">Portal corporativo</div></div><div class="headline"><h1>Seus aplicativos em um só lugar.</h1><p>Acesso seguro às ferramentas da MODOLOG.</p></div></div></header><main class="content"><section class="panel"><div class="eyebrow">Acesso de colaboradores</div><h2>Entrar no portal</h2><p class="muted">Utilize o mesmo e-mail e senha do MODOLOG Checklist.</p><form id="form"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" maxlength="254" placeholder="seuemail@empresa.com" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button primary" id="submit" type="submit">Entrar nos aplicativos</button><div class="status" id="msg" role="alert" aria-live="polite"></div></form></section></main><footer class="footer">MODOLOG Serviços e Locações · Portal de aplicativos</footer><script>const form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='';try{const res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{throw Error('O servidor não retornou JSON (HTTP '+res.status+'). Verifique a publicação das Functions.')}if(!res.ok)throw Error(data.error||'Falha de autenticação (HTTP '+res.status+').');document.getElementById('password').value='';location.assign('/apps');}catch(err){msg.textContent=err.message||'Falha ao entrar.';}finally{btn.disabled=false}});</script></body></html>
